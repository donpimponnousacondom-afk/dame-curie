name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: scripts/lint.sh --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"
