name: ${INSTANCE_ID:?Set INSTANCE_ID in deploy.env}

x-host-timezone: &host-timezone
  type: bind
  source: /etc/localtime
  target: /etc/dame-curie-localtime
  read_only: true
  bind:
    create_host_path: false

x-ollama: &ollama
  image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
  init: true
  user: "0:0"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - *host-timezone
    - type: volume
      source: ollama-models
      target: /root/.ollama
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
  pids_limit: 256
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  ollama-pull:
    <<: *ollama
    restart: "no"
    environment:
      TZ: ":/etc/dame-curie-localtime"
      OLLAMA_HOST: 127.0.0.1:11434
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ollama serve >/tmp/ollama-pull.log 2>&1 &
        server=$$!
        trap 'kill "$$server" 2>/dev/null || true; wait "$$server" 2>/dev/null || true' EXIT
        remaining=60
        until ollama list >/dev/null 2>&1; do
          kill -0 "$$server"
          remaining=$$((remaining - 1))
          test "$$remaining" -gt 0
          sleep 1
        done
        if ! ollama show qwen3-embedding:0.6b >/dev/null 2>&1; then
          ollama pull qwen3-embedding:0.6b
        fi
    mem_limit: 1g
    cpus: 2
    networks:
      - model-download

  ollama:
    <<: *ollama
    restart: unless-stopped
    environment:
      TZ: ":/etc/dame-curie-localtime"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    command: ["serve"]
    mem_limit: 6g
    cpus: 12
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen3-embedding:0.6b"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - embeddings

  bot:
    image: ${APP_IMAGE:?Set a versioned APP_IMAGE in deploy.env}
    init: true
    user: "0:0"
    read_only: false
    restart: unless-stopped
    stop_grace_period: 45s
    entrypoint:
      - /bin/sh
      - -ec
      - python /opt/dame-curie/check_embeddings.py && exec "$$@"
      - --
    depends_on:
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ":/etc/dame-curie-localtime"
      HOME: /home/dame-curie
      DAME_CURIE_ENV_FILE: /config/bot.env
      DAME_CURIE_CONTAINER_MODE: "true"
      DAME_CURIE_INSTANCE_ID: ${INSTANCE_ID}
    volumes:
      - *host-timezone
      - type: bind
        source: ${INSTANCE_DIR:?Set INSTANCE_DIR in deploy.env}/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INSTANCE_DIR}/config/prompts
        target: /config/prompts
        bind:
          create_host_path: false
      - type: bind
        source: ${INSTANCE_DIR}/data
        target: /state/data
        bind:
          create_host_path: false
      - type: bind
        source: ${INSTANCE_DIR}/sites
        target: /state/sites
        bind:
          create_host_path: false
      - type: bind
        source: ${INSTANCE_DIR}/shell
        target: /state/shell
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /app/temp:rw,nosuid,nodev,size=256m,mode=1777
    command: ["python", "bot.py"]
    mem_limit: 4g
    cpus: 4
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - outbound
      - embeddings

networks:
  outbound:
  embeddings:
    internal: true
  model-download:

volumes:
  ollama-models:
